services:
  mysql:
    image: mysql:8.4
    container_name: smart-meter-explorer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SME_MYSQL_ROOT_PASSWORD:?Run launch.py to create local database credentials}
      MYSQL_DATABASE: smart_meter_explorer
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - sme_mysql_data:/var/lib/mysql
      - ./.local/mysql-init:/docker-entrypoint-initdb.d:ro
    command: ["--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  sme_mysql_data:
